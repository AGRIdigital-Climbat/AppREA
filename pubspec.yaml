name: rea
description: "Sistema de Reporte de Eventos Adversos - VIDECI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.0
  
  # HTTP
  http: ^1.2.0
  
  # Storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^10.0.0
  sqflite: ^2.3.0
  path: ^1.8.0
  
  # Connectivity
  connectivity_plus: ^6.0.0
  
  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.0
  
  # Forms
  intl: ^0.19.0
  
  # Location
  geolocator: ^14.0.0
  geocoding: ^5.0.0
  
  # File System
  path_provider: ^2.1.6
  
  # Camera/Images
  image_picker: ^1.1.0
  
  # Permissions
  permission_handler: ^12.0.0
  device_info_plus: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
